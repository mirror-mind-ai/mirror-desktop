[package]
name = "mirror-desktop"
version = "0.2.0-alpha.58"
description = "Mirror Desktop application"
authors = ["Mirror Mind"]
license = "UNLICENSED"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
url = "2"
tauri = { version = "2", features = [] }
rfd = "0.15"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-updater = "2.9.0"
tauri-plugin-process = "2.3.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
development-channel = []
# CR149: the evaluation channel is the one that runs release-optimized code against the
# Navigator's real data, which is exactly where a performance question has to be answered. Giving
# it `tauri/devtools` puts the Web Inspector in a build whose Rust is optimized the same way
# production's is, instead of profiling a debug build that is not the app anyone uses.
#
# Production can never receive it: `devtools` is not in `default`, and `build-user` passes no
# `--features` at all. Both halves of that are asserted by tests rather than left to care.
evaluation-channel = ["tauri/devtools"]
